# ROS2 parameter file for LpsSaWeighApp.
#
# This is an ADDITIVE replacement for a subset of config/LpsSaWeighApp.rb's
# "Parameters" block -- specifically the keys verified to be actually read
# by app code via getTaskConfig()/ConfigSection:
#   - cycleRate_hz    (LpsSaWeighApp.cpp:239, feeds LpsSaWeighInfoTbl.CycleRate_hz,
#                       used at LpsSaWeighApp.h:585 to compute transmitPeriodCount_)
#   - tempRoot        (LpsSaWeighApp.cpp:263-267)
#   - storageRoot     (LpsSaWeighApp.cpp:272-277)
#   - CPMExecTxPeriod (LpsSaWeighApp.cpp:291-294)
#
# Values below are transcribed 1:1 from config/LpsSaWeighApp.rb -- do not
# change a value here without updating the .rb file's comment/reference,
# and vice versa, until cutover (see config_migration_plan.md Phase 5).
#
# NOT covered here (documented, intentionally deferred -- see
# config_migration_plan.md Phase 3b / risk table for why):
#   - scheduler / schedulerPriority: no ROS2 parameter equivalent; remains
#     AIS task::Task-controlled.
#   - CPMExecRate: read only in LpsSaCalibration.cpp:209 into
#     weighInitTbl.ExecRate, itself part of the larger machine-specific-config
#     ("rubyCfg") block read via getTaskParser().getSection(...) rather than
#     getTaskConfig() directly. Left as-is this phase; see
#     "Update LpsSaCalibration.cpp" step for the guarded read added there.
#   - ScsRxTimeouts.SystemHardwareHealthRequestOutput_txRate_sec: no call
#     site was found reading this key from app code in this app's .cpp/.h
#     files (search performed; only declared in the .rb file). Left
#     unmigrated -- flag for confirmation with the original author before
#     assuming it is dead configuration.
#   - ConditionConfig.AutonomyConditions: no call site was found reading
#     this key directly in LpsSaWeighApp's own source (may be consumed by
#     a different AIS subsystem/library at a level this repo doesn't show).
#     Deferred -- do not delete from the .rb file.
#   - ChassisIMU.*: read by LpsSaChassisIMU::init(const TaskParser&) via
#     taskParser.getSection("ChassisIMU", cs) (LpsSaChassisIMU.h:99-172).
#     Migrating this requires changing that function's signature (it takes
#     a TaskParser&, not a ROS2 node), which cannot be safely verified
#     without a build environment. Deferred to a follow-up change with
#     compiler verification available -- see config_migration_plan.md.
#
# Node name below MUST match the string passed to
# std::make_shared<rclcpp::Node>("weigh_app_node") in LpsSaWeighApp.cpp:558.
weigh_app_node:
  ros__parameters:
    # LpsSaWeighApp.rb: "cycleRate_hz" => 50.0
    cycle_rate_hz: 50.0

    # LpsSaWeighApp.rb: "storageRoot" => "/opt/appdata/CPM/LpsSaWeighApp/nvm"
    storage_root: "/opt/appdata/CPM/LpsSaWeighApp/nvm"

    # LpsSaWeighApp.rb: "tempRoot" => "/tmp/appdata/CPM/LpsSaWeighApp"
    temp_root: "/tmp/appdata/CPM/LpsSaWeighApp"

    # LpsSaWeighApp.rb: "CPMExecTxPeriod" => 0.1 (100 msec)
    cpm_exec_tx_period: 0.1
