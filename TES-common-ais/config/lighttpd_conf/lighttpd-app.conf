# ── Core ──────────────────────────────────────────────────────────────────────
server.document-root = "/opt/CPM/www"
server.port          = 8080
server.use-ipv6      = "disable"
server.errorlog      = "/tmp/lighttpd_error.log"

alias.url += ( "/CPM/cgi-bin" => "/opt/CPM/cgi-bin/" )
alias.url += ( "/CPM" => "/opt/CPM/www/gen6" )

$HTTP["url"] =~ "^/CPM/cgi-bin" {
   cgi.assign = ( "" => "" )
   setenv.add-response-header = ("Cache-Control" => "no-store")
}
else $HTTP["url"] =~ "^/CPM/" {
   setenv.add-response-header = ("Cache-Control" => "no-cache, max-age=0")
}

